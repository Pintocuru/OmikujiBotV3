<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <!-- Vue -->
    <script src="../__origin/js/vue3.min.js"></script>
    <!-- おみくじデータ -->
    <script src="./omikujiData.js"></script>
    <!-- 共通ローダー -->
    <script src="./script.js"></script>
  </head>
  <body>
    <div id="App"></div>
    <script>
      // DOMContentLoaded で実行。defer との競合なし
      document.addEventListener('DOMContentLoaded', function () {
        OmikujiLoader.run({
          cssFiles: ['common.css', 'ConfigMaker.css'],
          jsFiles: ['common.js', 'vendors.js', 'ConfigMaker.js'],
          requireOneComme: false,
          mountFn() {
            if (window.OmikujiBot?.mountConfigMaker) {
              window.OmikujiBot.mountConfigMaker()
            } else {
              console.error('mountConfigMaker が見つかりません')
            }
          },
        })
      })
    </script>
  </body>
</html>
