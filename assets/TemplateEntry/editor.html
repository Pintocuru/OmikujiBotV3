<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <!-- Vue -->
    <script src="http://192.168.50.51:11180/templates/custom/__origin/js/vue3.min.js"></script>
    <!-- おみくじデータ -->
    <script src="./omikujiData.js"></script>
    <!-- 共通ローダー -->
    <script src="./script.js"></script>
  </head>
  <body>
    <div id="App"></div>
    <script>
      // DOMContentLoaded で実行。defer との競合なし
      document.addEventListener('DOMContentLoaded', function () {
        OmikujiLoader.run({
          entry: 'editor',
          requireOneComme: false,
          mountFn() {
            if (window.OmikujiBot?.mountEditor) {
              window.OmikujiBot.mountEditor()
            } else {
              console.error('mountEditor が見つかりません')
            }
          },
        })
      })
    </script>
  </body>
</html>
